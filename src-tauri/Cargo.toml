[package]
name = "money-counter-spike"
version = "0.0.1"
description = "Phase 0 Tauri capability spike for a Windows tray money counter."
authors = ["money-counter"]
edition = "2021"

[lib]
name = "money_counter_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
