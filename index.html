<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>回血计数器 Spike</title>
  </head>
  <body>
    <main id="widget-view" class="widget-shell">
      <section id="status-widget" class="status-widget" aria-label="回血计数器实时状态">
        <div class="coin-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img">
            <circle cx="24" cy="24" r="20" />
            <path d="M15 25c5 6 13 6 18 0" />
            <path d="M17 18h.01M31 18h.01" />
            <path d="M24 9v7M24 32v7" />
          </svg>
        </div>

        <div class="metric primary">
          <span>今日回血</span>
          <strong id="earned">约 ¥0+</strong>
        </div>

        <div class="metric">
          <span>到账/s</span>
          <strong id="rate">¥0.00/s</strong>
        </div>

        <div class="metric progress-metric">
          <span>进度</span>
          <strong id="progress">0%</strong>
        </div>

        <div class="spark" aria-hidden="true">
          <i id="progress-bar"></i>
        </div>

        <nav class="widget-actions" aria-label="桌面操作">
          <button id="toggle-pin" class="icon-button is-on" type="button" aria-label="取消置顶" title="取消置顶" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m14.5 4 5.5 5.5" />
              <path d="M15 9.5 8.5 16l-3 3-.5-3.5 3-3L14.5 6 18 9.5Z" />
              <path d="m9 15 6 6" />
            </svg>
          </button>
          <button id="cycle-status" class="icon-button" type="button" aria-label="切换状态" title="切换状态">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 12a8 8 0 0 1 13.5-5.8" />
              <path d="M17 3v4h-4" />
              <path d="M20 12a8 8 0 0 1-13.5 5.8" />
              <path d="M7 21v-4h4" />
            </svg>
          </button>
          <button id="open-settings" class="icon-button" type="button" aria-label="打开设置" title="设置">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" />
              <path d="M19 12a7.2 7.2 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a8.2 8.2 0 0 0-1.8-1L14.4 3h-4.8l-.3 3.1a8.2 8.2 0 0 0-1.8 1l-2.4-1-2 3.4 2 1.5a7.2 7.2 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a8.2 8.2 0 0 0 1.8 1l.3 3.1h4.8l.3-3.1a8.2 8.2 0 0 0 1.8-1l2.4 1 2-3.4-2-1.5c.1-.3.1-.7.1-1Z" />
            </svg>
          </button>
          <div id="local-stats-trigger" class="local-stats-trigger" data-local-stats-hidden="true">
            <button id="local-stats-button" class="icon-button" type="button" aria-label="查看本地统计" title="本地统计">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 19V9" />
                <path d="M12 19V5" />
                <path d="M19 19v-7" />
                <path d="M4 19h16" />
              </svg>
            </button>
          </div>
          <button id="copy-card" class="icon-button" type="button" aria-label="复制分享图" title="复制分享图">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="8" y="8" width="11" height="11" rx="2" />
              <path d="M5 15H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1" />
            </svg>
          </button>
          <button id="save-card" class="icon-button" type="button" aria-label="保存分享图" title="保存分享图">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12" />
              <path d="m7 10 5 5 5-5" />
              <path d="M5 21h14" />
            </svg>
          </button>
          <button id="hide-window" class="icon-button soft" type="button" aria-label="隐藏到托盘" title="隐藏到托盘">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14" />
            </svg>
          </button>
        </nav>
      </section>

      <section id="onboarding-view" class="onboarding-shell" aria-labelledby="onboarding-title" hidden>
        <div class="onboarding-card" data-no-window-drag>
          <header class="onboarding-header">
            <p class="eyebrow">首次设置</p>
            <h1 id="onboarding-title">先把回血规则设好</h1>
            <p>3 步完成基础配置，之后也可以在设置里修改。</p>
          </header>

          <div id="onboarding-step-income" class="onboarding-step" data-onboarding-step="0">
            <h2>收入</h2>
            <label>
              <span class="field-label">收入模式 <span class="field-help" tabindex="0" aria-label="决定收入按月、按天还是按小时换算。" data-tip="决定收入按月、按天还是按小时换算。">?</span></span>
              <select id="onboarding-income-mode">
                <option value="monthly">月薪</option>
                <option value="daily">日薪</option>
                <option value="hourly">时薪</option>
              </select>
            </label>
            <label>
              <span class="field-label">收入金额 <span class="field-help" tabindex="0" aria-label="用于计算每秒到账速度，按所选收入模式填写。" data-tip="用于计算每秒到账速度，按所选收入模式填写。">?</span></span>
              <input id="onboarding-income-amount" type="number" min="0" step="100" inputmode="decimal" />
            </label>
          </div>

          <div id="onboarding-step-schedule" class="onboarding-step" data-onboarding-step="1" hidden>
            <h2>日程</h2>
            <label>
              <span class="field-label">工作日规则 <span class="field-help" tabindex="0" aria-label="用于判断哪些日期自动计入工作日。" data-tip="用于判断哪些日期自动计入工作日。">?</span></span>
              <select id="onboarding-workday-mode">
                <option value="weekdays">双休</option>
                <option value="singleRest">单休</option>
                <option value="all">每天</option>
              </select>
            </label>
            <label>
              <span class="field-label">上班时间 <span class="field-help" tabindex="0" aria-label="用于自动识别开工和计算当天进度。" data-tip="用于自动识别开工和计算当天进度。">?</span></span>
              <input id="onboarding-start-time" type="time" />
            </label>
            <label>
              <span class="field-label">下班时间 <span class="field-help" tabindex="0" aria-label="用于自动识别收工和计算当天进度。" data-tip="用于自动识别收工和计算当天进度。">?</span></span>
              <input id="onboarding-end-time" type="time" />
            </label>
            <label>
              <span class="field-label">午休开始 <span class="field-help" tabindex="0" aria-label="从这个时间开始暂停计入工作时长。" data-tip="从这个时间开始暂停计入工作时长。">?</span></span>
              <input id="onboarding-lunch-start" type="time" />
            </label>
            <label>
              <span class="field-label">午休结束 <span class="field-help" tabindex="0" aria-label="到这个时间恢复计入工作时长。" data-tip="到这个时间恢复计入工作时长。">?</span></span>
              <input id="onboarding-lunch-end" type="time" />
            </label>
          </div>

          <div id="onboarding-step-preferences" class="onboarding-step" data-onboarding-step="2" hidden>
            <h2>偏好</h2>
            <label>
              <span class="field-label">隐私显示 <span class="field-help" tabindex="0" aria-label="控制桌面小窗如何显示金额，保护隐私。" data-tip="控制桌面小窗如何显示金额，保护隐私。">?</span></span>
              <select id="onboarding-privacy-mode">
                <option value="blurred">模糊金额</option>
                <option value="real">真实金额</option>
                <option value="progress">进度百分比</option>
                <option value="alias">暗号模式</option>
              </select>
            </label>
            <label>
              <span class="field-label">本地统计 <span class="field-help" tabindex="0" aria-label="开启后只在本机记录近 30 天汇总。" data-tip="开启后只在本机记录近 30 天汇总。">?</span></span>
              <select id="onboarding-local-stats-enabled">
                <option value="off">关闭</option>
                <option value="on">开启</option>
              </select>
            </label>
            <label>
              <span class="field-label">低频提醒 <span class="field-help" tabindex="0" aria-label="开启后按工作节奏发送低频系统提醒。" data-tip="开启后按工作节奏发送低频系统提醒。">?</span></span>
              <select id="onboarding-reminder-mode">
                <option value="off">关闭</option>
                <option value="on">开启</option>
              </select>
            </label>
          </div>

          <footer class="onboarding-actions">
            <button id="skip-onboarding" class="secondary-button" type="button">跳过</button>
            <button id="onboarding-prev" class="secondary-button" type="button">上一步</button>
            <button id="onboarding-next" class="primary-button" type="button">下一步</button>
            <button id="complete-onboarding" class="primary-button" type="button" hidden>开始使用</button>
          </footer>
        </div>
      </section>

      <div id="status-menu" class="status-menu" role="menu" aria-label="状态" hidden>
        <button type="button" data-status="auto" role="menuitemradio">自动</button>
        <button type="button" data-status="working" role="menuitemradio">开工</button>
        <button type="button" data-status="fishing" role="menuitemradio">摸鱼</button>
        <button type="button" data-status="lunch" role="menuitemradio">午休</button>
        <button type="button" data-status="pause" role="menuitemradio">暂停</button>
        <button type="button" data-status="offWork" role="menuitemradio">收工</button>
      </div>

      <div id="local-stats-panel" class="local-stats-panel" role="status" aria-live="polite" hidden>
        <p id="local-stats-empty">开启后开始记录，最多保留 30 天。</p>
        <dl>
          <div>
            <dt>今日记录</dt>
            <dd id="local-stats-today">暂无记录</dd>
          </div>
          <div>
            <dt>近 7 天使用</dt>
            <dd id="local-stats-used-days">0 天</dd>
          </div>
          <div>
            <dt>近 7 天回血</dt>
            <dd id="local-stats-earned">约 ¥0+</dd>
          </div>
          <div>
            <dt>近 7 天摸鱼</dt>
            <dd id="local-stats-fishing">0m</dd>
          </div>
          <div>
            <dt>数据保留</dt>
            <dd id="local-stats-retention">最近 30 天</dd>
          </div>
        </dl>
      </div>

      <p id="desktop-status" class="status-line" aria-live="polite">正在启动桌面小工具。</p>
      <canvas id="share-card" width="900" height="480" aria-label="分享图预览"></canvas>
    </main>

    <main id="settings-view" class="settings-shell" hidden>
      <section class="settings-panel" aria-labelledby="settings-title">
        <header class="settings-header">
          <div>
            <p class="eyebrow">本地离线配置</p>
            <h1 id="settings-title">回血计数器设置</h1>
          </div>
          <button id="close-settings" class="icon-button soft" type="button" aria-label="关闭设置" title="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </header>

        <div class="form-grid">
          <label>
            <span class="field-label">收入模式 <span class="field-help" tabindex="0" aria-label="决定收入按月、按天还是按小时换算。" data-tip="决定收入按月、按天还是按小时换算。">?</span></span>
            <select id="income-mode">
              <option value="monthly">月薪</option>
              <option value="daily">日薪</option>
              <option value="hourly">时薪</option>
            </select>
          </label>
          <label>
            <span class="field-label">收入金额 <span class="field-help" tabindex="0" aria-label="用于计算每秒到账速度，按所选收入模式填写。" data-tip="用于计算每秒到账速度，按所选收入模式填写。">?</span></span>
            <input id="income-amount" type="number" min="0" step="100" inputmode="decimal" />
          </label>
          <label>
            <span>每月工作日</span>
            <input id="work-days" type="number" min="1" step="0.5" inputmode="decimal" />
          </label>
          <label>
            <span>每日目标小时</span>
            <input id="daily-hours" type="number" min="1" max="16" step="0.5" inputmode="decimal" />
          </label>
          <label>
            <span>工时模式</span>
            <select id="work-mode">
              <option value="standard">标准工时</option>
              <option value="flexible">弹性目标</option>
            </select>
          </label>
          <label>
            <span class="field-label">工作日规则 <span class="field-help" tabindex="0" aria-label="用于判断哪些日期自动计入工作日。" data-tip="用于判断哪些日期自动计入工作日。">?</span></span>
            <select id="workday-mode">
              <option value="weekdays">双休</option>
              <option value="singleRest">单休</option>
              <option value="all">每天</option>
            </select>
          </label>
          <label>
            <span class="field-label">上班时间 <span class="field-help" tabindex="0" aria-label="用于自动识别开工和计算当天进度。" data-tip="用于自动识别开工和计算当天进度。">?</span></span>
            <input id="start-time" type="time" />
          </label>
          <label>
            <span class="field-label">下班时间 <span class="field-help" tabindex="0" aria-label="用于自动识别收工和计算当天进度。" data-tip="用于自动识别收工和计算当天进度。">?</span></span>
            <input id="end-time" type="time" />
          </label>
          <label>
            <span class="field-label">午休开始 <span class="field-help" tabindex="0" aria-label="从这个时间开始暂停计入工作时长。" data-tip="从这个时间开始暂停计入工作时长。">?</span></span>
            <input id="lunch-start" type="time" />
          </label>
          <label>
            <span class="field-label">午休结束 <span class="field-help" tabindex="0" aria-label="到这个时间恢复计入工作时长。" data-tip="到这个时间恢复计入工作时长。">?</span></span>
            <input id="lunch-end" type="time" />
          </label>
          <label>
            <span class="field-label">隐私显示 <span class="field-help" tabindex="0" aria-label="控制桌面小窗如何显示金额，保护隐私。" data-tip="控制桌面小窗如何显示金额，保护隐私。">?</span></span>
            <select id="privacy-mode">
              <option value="blurred">模糊金额</option>
              <option value="real">真实金额</option>
              <option value="progress">进度百分比</option>
              <option value="alias">暗号模式</option>
            </select>
          </label>
          <label>
            <span class="field-label">本地统计 <span class="field-help" tabindex="0" aria-label="开启后只在本机记录近 30 天汇总。" data-tip="开启后只在本机记录近 30 天汇总。">?</span></span>
            <select id="local-stats-enabled">
              <option value="off">关闭</option>
              <option value="on">开启</option>
            </select>
          </label>
          <label>
            <span>当前状态</span>
            <select id="status-override">
              <option value="auto">自动</option>
              <option value="working">开工</option>
              <option value="fishing">摸鱼</option>
              <option value="lunch">午休</option>
              <option value="pause">暂停</option>
              <option value="offWork">收工</option>
            </select>
          </label>
          <label>
            <span class="field-label">低频提醒 <span class="field-help" tabindex="0" aria-label="开启后按工作节奏发送低频系统提醒。" data-tip="开启后按工作节奏发送低频系统提醒。">?</span></span>
            <select id="reminder-mode">
              <option value="off">关闭</option>
              <option value="on">开启</option>
            </select>
          </label>
          <label>
            <span>日程提醒</span>
            <select id="schedule-reminders">
              <option value="on">开启</option>
              <option value="off">关闭</option>
            </select>
          </label>
          <label>
            <span>休息提醒</span>
            <select id="break-reminders">
              <option value="on">开启</option>
              <option value="off">关闭</option>
            </select>
          </label>
          <label>
            <span>提醒间隔分钟</span>
            <input id="reminder-interval" type="number" min="30" max="240" step="15" inputmode="numeric" />
          </label>
          <label>
            <span>勿扰开始</span>
            <input id="quiet-start" type="time" />
          </label>
          <label>
            <span>勿扰结束</span>
            <input id="quiet-end" type="time" />
          </label>
        </div>

        <section class="share-template-section" aria-labelledby="share-template-title">
          <div class="share-template-heading">
            <div>
              <p class="eyebrow">分享图</p>
              <h2 id="share-template-title">选择分享模板</h2>
            </div>
            <span class="share-template-hint">悬停或聚焦查看预览</span>
          </div>
          <div class="share-template-grid" role="group" aria-label="分享模板">
            <button
              id="share-template-daily-report"
              class="share-template-option is-daily-report"
              type="button"
              data-share-template="dailyReport"
              aria-pressed="true"
            >
              <span class="share-template-meta">
                <strong>今日打工战报</strong>
                <small>深绿 · 金色</small>
              </span>
              <span class="share-template-preview" aria-hidden="true">
                <span class="preview-title"></span>
                <span class="preview-hero"></span>
                <span class="preview-row"></span>
                <span class="preview-bar"></span>
              </span>
            </button>
            <button
              id="share-template-fishing-bill"
              class="share-template-option is-fishing-bill"
              type="button"
              data-share-template="fishingBill"
              aria-pressed="false"
            >
              <span class="share-template-meta">
                <strong>摸鱼回血账单</strong>
                <small>蓝紫 · 青色</small>
              </span>
              <span class="share-template-preview" aria-hidden="true">
                <span class="preview-title"></span>
                <span class="preview-hero"></span>
                <span class="preview-row"></span>
                <span class="preview-bar"></span>
              </span>
            </button>
            <button
              id="share-template-offwork-card"
              class="share-template-option is-offwork-card"
              type="button"
              data-share-template="offworkCard"
              aria-pressed="false"
            >
              <span class="share-template-meta">
                <strong>下班生存卡</strong>
                <small>橙红 · 暖黄</small>
              </span>
              <span class="share-template-preview" aria-hidden="true">
                <span class="preview-title"></span>
                <span class="preview-hero"></span>
                <span class="preview-row"></span>
                <span class="preview-bar"></span>
              </span>
            </button>
          </div>
        </section>

        <div class="settings-actions">
          <button id="save-settings" class="primary-button" type="button">保存设置</button>
          <button id="send-notification" class="secondary-button" type="button">发送测试通知</button>
          <button id="toggle-autostart" class="secondary-button" type="button">开机自启：检测中</button>
          <button id="clear-settings" class="danger-button" type="button">清空本地设置</button>
        </div>

        <p class="settings-status" aria-live="polite">
          <span id="settings-status">设置只保存在本机。</span>
          <button
            id="open-notification-settings"
            class="settings-link-button"
            type="button"
            aria-label="打开 Windows 通知设置"
            hidden
          >
            打开通知设置
          </button>
        </p>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
